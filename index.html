<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDGoC HNU | Application Status</title>
    
    <!-- Favicon -->
    <link rel="icon" href="sitelogo.png" type="image/png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
    
    <!-- Ambient Background Shapes -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <main class="container">
        
        <header class="header">
            <div class="logo-container">
                <img src="LOGO.png" alt="GDGoC HNU Logo" class="site-logo">
            </div>
            <h1>Application Status</h1>
            <p>Enter your 14-digit National ID to check the real-time status of your application.</p>
        </header>

        <form id="searchForm" class="search-form glass-panel">
            <div class="input-group">
                <i class="fa-solid fa-id-card input-icon"></i>
                <input 
                    type="text" 
                    id="nationalId" 
                    name="nationalId" 
                    placeholder="Enter your National ID (14 digits)" 
                    pattern="\d{14}" 
                    maxlength="14"
                    required
                    autocomplete="off"
                >
            </div>
            <button type="submit" id="submitBtn" class="btn-primary">
                <span class="btn-text">Check Status</span>
                <i class="fa-solid fa-arrow-right btn-icon"></i>
                <div class="loader-spinner" style="display: none;"></div>
            </button>
        </form>

        <div id="resultsContainer" class="results-container">
            <div class="empty-state" id="initialState">
                <i class="fa-solid fa-magnifying-glass"></i>
                <p>Search to view your application status</p>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p>Designed with passion by GDGoC Helwan National University Team &copy; 2026</p>
    </footer>

    <!-- Custom JS -->
    <script src="main.js?v=8"></script>
</body>
</html>
